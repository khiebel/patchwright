[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwright"
version = "0.1.0"
description = "Owner-driven IoT firmware patching. Right to repair, for the connected home."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Kevin Hiebel", email = "khiebel@gmail.com"},
]
keywords = ["iot", "patching", "right-to-repair", "firmware", "security", "cve"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
chargepoint = ["python-chargepoint>=2.0"]
events = ["boto3>=1.34"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]
all = ["python-chargepoint>=2.0", "boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/khiebel/patchwright"
Repository = "https://github.com/khiebel/patchwright"
Issues = "https://github.com/khiebel/patchwright/issues"
Documentation = "https://github.com/khiebel/patchwright#readme"

[project.scripts]
patchwright = "patchwright.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchwright*"]

[tool.setuptools.package-data]
patchwright = ["manifests/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
