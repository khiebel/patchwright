# here are gathered from Apple's developer documentation pages + observed
# 'newest available' in the Apple TV Settings UI.
#
# Update by submitting a PR. Required fields per generation:
#   latest: <tvOS version string>
#   updated: <YYYY-MM-DD when this entry was last verified>
#   source: <human note — where you got this value>
