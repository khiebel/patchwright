# Apple TV (tvOS) firmware manifest.
#
# Apple doesn't publish a machine-readable "latest tvOS" feed at a stable
# public URL. Maintainers verify against:
#   1. en.wikipedia.org/wiki/TvOS  (cites Apple primary sources)
#   2. The Settings → System → Software Updates screen on each device
#
# Marketing-name → model-identifier mapping (Apple's public hardware IDs):
#   AppleTV5,3   — Apple TV HD
#   AppleTV6,2   — Apple TV 4K (1st gen, 2017)
#   AppleTV11,1  — Apple TV 4K (2nd gen, 2021)
#   AppleTV14,1  — Apple TV 4K (3rd gen, 2022)
#
# All four generations share the current tvOS train. Update by PR.
# Required per entry: latest, updated, source.

